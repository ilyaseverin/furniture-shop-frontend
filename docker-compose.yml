services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_CATALOG_API_BASE_URL: ${NEXT_PUBLIC_CATALOG_API_BASE_URL}
        NEXT_PUBLIC_IMAGE_API_BASE_URL: ${NEXT_PUBLIC_IMAGE_API_BASE_URL}
        NEXT_PUBLIC_COLLECTION_HERO_ID: ${NEXT_PUBLIC_COLLECTION_HERO_ID}
        NEXT_PUBLIC_COLLECTION_PICKS_ID: ${NEXT_PUBLIC_COLLECTION_PICKS_ID}
        NEXT_PUBLIC_COLLECTION_INSTAGRAM_ID: ${NEXT_PUBLIC_COLLECTION_INSTAGRAM_ID}
        NEXT_PUBLIC_COLLECTION_CAROUSEL_ID: ${NEXT_PUBLIC_COLLECTION_CAROUSEL_ID}
    ports:
      - "3000:3000"
    environment:
      - CATALOG_API_BASE_URL=${CATALOG_API_BASE_URL}
      - IMAGE_API_BASE_URL=${IMAGE_API_BASE_URL}
    restart: unless-stopped
